<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на компоненты крови</title>
    <link rel="stylesheet" href="blood-request.css?v=5.2.5">
</head>
<body>
    <div class="request-actions" aria-label="Действия с заявкой">
        <button id="printButton" type="button">Печать</button>
        <button id="clearButton" type="button">Очистить введённые данные</button>
        <button id="closeButton" type="button">Закрыть</button>
    </div>

    <p id="payloadWarning" class="payload-warning hidden" role="status">
        Данные пациента не получены. Поля можно заполнить вручную.
    </p>

    <main class="request-document">
        <section class="request-sheet request-front" aria-label="Лицевая сторона заявки">
            <h1>ЗАЯВКА НА КОМПОНЕНТЫ КРОВИ</h1>

            <div class="line-field short-line">
                <label for="department">Отделение</label>
                <input id="department" data-user-field type="text" autocomplete="off">
            </div>
            <div class="line-field short-line">
                <label for="admissionChannel">Канал поступления пациента</label>
                <input id="admissionChannel" data-user-field type="text" autocomplete="off">
            </div>
            <div class="patient-line">
                <div class="line-field">
                    <label for="patientFullName">Ф. И. О. пациента</label>
                    <input id="patientFullName" data-user-field type="text" autocomplete="off">
                </div>
                <div class="line-field age-field">
                    <label for="patientAge">Возраст</label>
                    <input id="patientAge" data-user-field type="text" inputmode="numeric">
                </div>
            </div>
            <div class="patient-line">
                <div class="line-field history-field">
                    <label for="patientHistoryNumber">№ истории болезни</label>
                    <input id="patientHistoryNumber" data-user-field type="text" autocomplete="off">
                </div>
                <div class="line-field birth-field">
                    <label for="patientBirthDate">Дата рождения</label>
                    <input id="patientBirthDate" data-user-field type="date">
                </div>
            </div>

            <label class="stacked-field diagnosis-field">
                <span>Диагноз</span>
                <textarea id="diagnosis" data-user-field rows="2"></textarea>
            </label>

            <label class="stacked-field indication-field">
                <span>Показания к переливанию</span>
                <select id="indication" data-user-field>
                    <option value=""></option>
                    <option>Восполнение объема циркулирующих эритроцитов</option>
                    <option>Восполнение факторов свертывания крови</option>
                </select>
                <output id="indicationPrintValue" class="print-select-value" aria-hidden="true"></output>
            </label>

            <div class="lab-line" aria-label="Лабораторные показатели">
                <div class="line-field"><label for="hemoglobin">Гемоглобин</label><input id="hemoglobin" data-user-field type="text"></div>
                <div class="line-field"><label for="hematocrit">Гематокрит</label><input id="hematocrit" data-user-field type="text"></div>
                <div class="line-field"><label for="aptt">АЧТВ</label><input id="aptt" data-user-field type="text"></div>
                <div class="line-field"><label for="inr">МНО</label><input id="inr" data-user-field type="text"></div>
            </div>

            <div class="medium-line">
                <label class="stacked-field medium-name">
                    <span>Наименование трансфузионной среды</span>
                    <select id="componentName" data-user-field>
                        <option value=""></option>
                        <option>Эритроцитсодержащий компонент</option>
                        <option>Эритроцитарная взвесь</option>
                        <option>Эритроцитарная масса</option>
                        <option>Свежезамороженная плазма</option>
                        <option>Концентрат тромбоцитов</option>
                        <option>Криопреципитат</option>
                        <option>Альбумин</option>
                        <option>Другое</option>
                    </select>
                    <output id="componentPrintValue" class="print-select-value" aria-hidden="true"></output>
                </label>
                <div class="line-field quantity-field">
                    <label for="componentQuantity">Количество</label>
                    <input id="componentQuantity" data-user-field type="text" autocomplete="off">
                </div>
            </div>

            <div class="blood-line">
                <label class="line-field select-line" for="recipientAbo">
                    <span>Группа крови</span>
                    <select id="recipientAbo" data-user-field>
                        <option value=""></option>
                        <option>O(I)</option>
                        <option>A(II)</option>
                        <option>B(III)</option>
                        <option>AB(IV)</option>
                    </select>
                </label>
                <label class="line-field select-line" for="recipientRh">
                    <span>Резус-фактор</span>
                    <select id="recipientRh" data-user-field>
                        <option value=""></option>
                        <option>Rh(+)</option>
                        <option>Rh(-)</option>
                    </select>
                </label>
            </div>

            <div class="doctor-line">
                <div class="line-field doctor-name">
                    <label for="requestDoctor">Врач, назначивший трансфузию</label>
                    <input id="requestDoctor" data-user-field type="text" autocomplete="off">
                </div>
                <div class="line-field date-field">
                    <label for="requestDate">Дата</label>
                    <input id="requestDate" data-user-field type="date">
                </div>
            </div>
        </section>

        <section class="request-sheet request-back" aria-label="Оборотная сторона заявки">
            <div class="reverse-label">(оборотная сторона)</div>
            <h2>Отпущено:</h2>
            <table class="release-table">
                <thead>
                    <tr>
                        <th>Наименование<br>трансфузионной среды</th>
                        <th>Группа крови</th>
                        <th>№ контейнера</th>
                        <th>Объем</th>
                        <th>Дата заготовки</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input id="releasedComponent1" data-user-field type="text"></td>
                        <td><input id="releasedBloodGroup1" data-user-field type="text"></td>
                        <td><input id="releasedContainer1" data-user-field type="text"></td>
                        <td><input id="releasedVolume1" data-user-field type="text"></td>
                        <td><input id="releasedCollectionDate1" data-user-field type="date"></td>
                    </tr>
                    <tr>
                        <td><input id="releasedComponent2" data-user-field type="text"></td>
                        <td><input id="releasedBloodGroup2" data-user-field type="text"></td>
                        <td><input id="releasedContainer2" data-user-field type="text"></td>
                        <td><input id="releasedVolume2" data-user-field type="text"></td>
                        <td><input id="releasedCollectionDate2" data-user-field type="date"></td>
                    </tr>
                    <tr>
                        <td><input id="releasedComponent3" data-user-field type="text"></td>
                        <td><input id="releasedBloodGroup3" data-user-field type="text"></td>
                        <td><input id="releasedContainer3" data-user-field type="text"></td>
                        <td><input id="releasedVolume3" data-user-field type="text"></td>
                        <td><input id="releasedCollectionDate3" data-user-field type="date"></td>
                    </tr>
                </tbody>
            </table>

            <div class="signature-line">
                <label for="issuedBy">Выдал</label>
                <input id="issuedBy" data-user-field type="text" autocomplete="off">
                <label for="issuedDate">Дата</label>
                <input id="issuedDate" data-user-field type="date">
            </div>
            <div class="signature-line received-line">
                <label for="receivedBy">Получил</label>
                <input id="receivedBy" data-user-field type="text" autocomplete="off">
            </div>
        </section>
    </main>

    <script src="blood-request.js?v=5.2.5"></script>
</body>
</html>
